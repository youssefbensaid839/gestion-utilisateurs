<!DOCTYPE html>
<html lang="fr" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - Mon App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: { extend: { colors: { primary: '#4f46e5' } } }
      }
    </script>
</head>
<body class="h-full bg-gradient-to-br from-indigo-50 via-white to-purple-50 flex items-center justify-center p-4">
    <div class="w-full max-w-md">
        <div class="bg-white shadow-2xl rounded-2xl overflow-hidden border border-gray-100">
            <div class="px-8 py-10">
                <h2 class="text-3xl font-bold text-center text-gray-900 mb-2">Bienvenue</h2>
                <p class="text-center text-gray-500 mb-8">Connectez-vous pour continuer</p>

                {% with messages = get_flashed_messages(with_categories=true) %}
                    {% if messages %}
                        {% for category, message in messages %}
                            <div class="mb-4 p-3 rounded-lg text-sm {% if category == 'error' %}bg-red-100 text-red-700 border border-red-200{% elif category == 'success' %}bg-green-100 text-green-700 border border-green-200{% else %}bg-blue-100 text-blue-700 border border-blue-200{% endif %}">
                                {{ message }}
                            </div>
                        {% endfor %}
                    {% endif %}
                {% endwith %}

                <form method="POST" class="space-y-5">
                    <div>
                        <label for="email" class="block text-sm font-medium text-gray-700">Adresse email</label>
                        <input type="email" name="email" id="email" required
                               class="mt-1 block w-full rounded-lg border-gray-300 shadow-sm focus:border-primary focus:ring-primary sm:text-sm px-4 py-3 transition duration-150">
                    </div>

                    <div>
                        <label for="password" class="block text-sm font-medium text-gray-700">Mot de passe</label>
                        <input type="password" name="password" id="password" required
                               class="mt-1 block w-full rounded-lg border-gray-300 shadow-sm focus:border-primary focus:ring-primary sm:text-sm px-4 py-3 transition duration-150">
                    </div>

                    <button type="submit"
                            class="w-full bg-primary hover:bg-primaryDark text-white font-medium py-3 px-4 rounded-lg shadow-md hover:shadow-lg transition duration-200 transform hover:-translate-y-0.5">
                        Se connecter
                    </button>
                </form>

                <p class="mt-6 text-center text-sm text-gray-600">
                    Pas de compte ? <a href="{{ url_for('signup') }}" class="font-medium text-primary hover:text-primaryDark">Créer un compte</a>
                </p>
            </div>
        </div>
    </div>
</body>
</html>
<!-- Tailwind CSS CDN (version la plus récente en 2026) -->
<script src="https://cdn.tailwindcss.com"></script>

<!-- Optionnel : configuration personnalisée (couleurs, etc.) -->
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          primary: '#4f46e5',     // indigo-600
          primaryDark: '#4338ca', // indigo-700
        }
      }
    }
  }
</script>
